name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emp
          POSTGRES_PASSWORD: emp
          POSTGRES_DB: emp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://emp:emp@localhost:5432/emp

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      # Fast, no-DB lane — every package/app.
      - name: Unit tests
        run: pnpm test

      # Real-Postgres lane: apply the schema, then the three invariant
      # suites that only mean something against a real database (privacy
      # boundary, account uniqueness) run here.
      - name: Migrate integration database
        run: pnpm --filter @emp/db run migrate:deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
        env:
          # Dummy values so apps/web's `next build` env validation passes —
          # nothing here needs to be real for a build-only check.
          SESSION_SECRET: ci-build-only-dummy-secret-not-used-at-runtime
          TELEGRAM_BOT_TOKEN: ci-dummy
          TELEGRAM_BOT_USERNAME: ci-dummy
          REDIRECT_BASE_URL: http://localhost:3000/r
          REDIS_URL: redis://localhost:6379
